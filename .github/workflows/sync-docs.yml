name: Sync Documentation

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches:
      - dev

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout metal-server
        uses: actions/checkout@v4
        with:
          path: metal-server

      - name: Checkout metl-docs
        uses: actions/checkout@v4
        with:
          repository: anismegdiche/metl-docs
          path: metl-docs
          token: ${{ secrets.DOCS_SYNC_PAT }}
          ref: dev

      - name: Sync docs directory
        run: |
          echo "Syncing docs directory:"
          echo "  metal-server/docs/ -> metl-docs/docs/"
          rsync -avz metal-server/docs/ metl-docs/docs/
          
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected. Committing changes:"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/
            git commit -m "docs: sync from metal-server [skip ci]"
            git push
          else
            echo "No changes to sync"
          fi
