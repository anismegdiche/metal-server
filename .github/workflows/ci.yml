name: CI Pipeline

on:
  push:
    branches:
      - latest
      - dev
  pull_request:
    branches:
      - latest
      - dev

jobs:
  matrix-build-test:
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-latest

          - windows-2019
          - windows-2022
          - windows-latest

          - macos-13
          - macos-14
          - macos-15
          - macos-latest
        
        node:
          - "22.13.0"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        env:
          NODE_NO_WARNINGS: 1
        with:
          ref: dev
      - name: Set up Node.js
        uses: actions/setup-node@v2
        env:
          NODE_NO_WARNINGS: 1
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Prepare
        run: npm run prepare
      - name: Compile
        run: npx tsc
      - name: run tests
        run: npm test
