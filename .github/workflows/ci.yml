name: CI Pipeline

on:
  push:
    branches:
      - latest
      - dev
  pull_request:
    branches:
      - latest
      - dev

jobs:
  matrix-build-test:
    if: github.ref_name == 'dev'
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-latest

          - windows-2019
          - windows-2022
          - windows-latest

          - macos-13
          - macos-14
          - macos-15
          - macos-latest
        
        node:
          - "22.13.0"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        env:
          NODE_NO_WARNINGS: 1
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v2
        env:
          NODE_NO_WARNINGS: 1
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Prepare
        run: npm run prepare

      - name: Compile
        run: npx tsc

      - name: run tests
        run: npm test
  
  
  docker-image-build-and-test:
    if: github.ref_name == 'dev'

    runs-on: ubuntu-latest
    
    permissions:
      contents: read  # Reduced permissions since we're not pushing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and test image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: dockerfile
          tags: metal-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true  # Makes the image available locally
          push: false  # Explicitly disable pushing

      # - name: Run tests in container
      #   run: |
      #     docker run --rm \
      #       metal-test:latest \
      #       npm test

