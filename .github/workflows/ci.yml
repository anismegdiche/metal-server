name: CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  enable-deploy:
    # set to true to enable deployment
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI enabled"

  matrix-build-and-test:
    if: github.ref_name == 'dev'
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04

          - windows-2019
          - windows-2022

          - macos-13
          - macos-14
          - macos-15

        node:
          - "24.13.0"
          - "25.5.0"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        env:
          NODE_NO_WARNINGS: 1
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v3
        env:
          NODE_NO_WARNINGS: 1
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run build

      - name: run tests
        run: npm test

  docker-image-build-and-test:
    if: github.ref_name == 'dev'

    runs-on: ubuntu-latest

    permissions:
      contents: read # Reduced permissions since we're not pushing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and test image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .docker/metal-test/dockerfile
          tags: metal-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true # Makes the image available locally
          push: false # Explicitly disable pushing

      - name: Run tests in container
        run: |
          docker run --rm \
            metal-test:latest \
            npm run test

  sync-docs:
    needs:
      - enable-deploy
      - matrix-build-and-test
      - docker-image-build-and-test
    if: github.ref_name == 'dev' && needs.docker-image-build-and-test.result == 'success' && needs.matrix-build-and-test.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        env:
          NODE_NO_WARNINGS: 1
        with:
          ref: dev

      - name: Run GitHub File Sync
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.GH_PAT }}
          SKIP_PR: true

  deploy:
    needs:
      - enable-deploy
      - matrix-build-and-test
      - docker-image-build-and-test
    if: github.ref_name == 'dev' && needs.docker-image-build-and-test.result == 'success' && needs.matrix-build-and-test.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        env:
          NODE_NO_WARNINGS: 1
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          ref: dev

      - name: Force sync dev to latest (delete orphans)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin
          git checkout dev
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/anismegdiche/metal-server.git
          git push origin dev:latest --force
