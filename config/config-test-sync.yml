version: "0.5"
server:
  port: 3000
  verbosity: debug
  timezone: UTC
  authentication:
  request-limit: 100mb

users:
  myapiuser: myStr@ngpa$$w0rd

sources:
  pg-clubdata-members:
    provider: postgres
    host: 127.0.0.1
    port: 5436
    user: admin
    password: "123456"
    database: clubdata
  mem-data:
    provider: memory
  plan-sync:
    provider: plans

schemas:
  mem:
    source: mem-data
    entities:
      syncdown:
        source: plan-sync
        entity: members-down
  pg:
    source: pg-clubdata-members

schedules:
  start:
    cron: "@start"
    plan: sync
    entity: members-up

plans:
  sync:
    members-up:
      steps:
        - sync:
            source:
              schema: pg
              entity: members
            destination:
              schema: mem
              entity: members
            on: memid

        - update:
            schema: mem
            entity: members
            data:
              address: XXXXXXXXXX

        - sync:
            source:
              schema: mem
              entity: members
            destination:
              schema: pg
              entity: members
            on: memid
    members-down:
      steps:
        - sync:
            source:
              schema: mem
              entity: members
            destination:
              schema: pg
              entity: members
            on: memid
