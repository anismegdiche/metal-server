version: '0.5'
server:
  port: 3000
  verbosity: info
  timezone: UTC
  cache:
    provider: memory
    options:
      autocreate: true
  authentication:
    default-role: all
    session-lifetime: 14400
    session-timeout: 3600
    provider: local
  request-limit: 100mb
  response-limit: 100mb
  response-rate:
    windowMs: 60000
    max: 600
    message: Too many requests from this IP, please try again later
  response-chunk: false
  response-compression: true
  ai-engines:
    build-batch-size: 5
    engines-url: http://127.0.0.1:5000
    timeout: 60000
    sleep: 5000
    cors:
      allowed-origins: '*'
      allowed-methods: GET,POST,OPTIONS
      allowed-headers: Origin, X-Requested-With, Content-Type, Accept, Authorization
    min-instance: 1
    max-instance: 5
    cpu-scale-up: 70
    cpu-scale-down: 10
    scale-interval: 20000
    scale-down-grace-period: 300000
    cpu: 4
    memory: 2
  endpoints:
    enable-mcp: true
roles:
  all: lacrud
  reader: r
  writer: cu
  cleaner: d
users:
  myapiuser:
    password: myStr@ngpa$$w0rd
sources:
  src-fs:
    provider: storage
    options:
      storage-mode: folders
      autocreate: false
      allow-delete: false
      folders-pattern: '*.*'
      files-pattern: '*.*'
      storage-type: fs
      folder: ../../../metal-tests/fs-storage
  src-fs-failed:
    provider: storage
    options:
      storage-mode: folders
      autocreate: false
      allow-delete: false
      folders-pattern: '*.*'
      files-pattern: '*.*'
      storage-type: fs
      folder: ../metal-tests/failed
  src-json:
    provider: storage
    options:
      storage-mode: files
      content:
        '*.json':
          content-type: json
          json-path: rows
      autocreate: true
      storage-type: fs
      folder: ../metal-tests/fs-storage
  src-csv:
    provider: storage
    options:
      storage-mode: files
      content:
        '*.csv':
          content-type: csv
          csv-delimiter: ;
          csv-newline: |+

          csv-header: true
          csv-quote: '"'
      autocreate: true
      storage-type: fs
      folder: ./data/
  rest-fakerestapi:
    provider: webservice
    host: https://fakerestapi.azurewebsites.net/api/v1/
    options:
      type: rest
      endpoints:
        collection-read:
          get: /${{ $entity }}
        item-create:
          post: /${{ $entity }}
        item-update:
          put: /${{ $entity }}/${{ $row.id }}
        item-delete:
          delete: /${{ $entity }}/${{ $row.id }}
      content-type: json
  soap-movies:
    provider: webservice
    host: http://127.0.0.1:8080/ws/movies.wsdl
    options:
      type: soap
      endpoints:
        collection-read:
          response: Envelope.Body.listMoviesResponse.${{ $entity }}s
          listMovies: null
        item-create:
          data:
            ${{ $entity }}: ${{ $row }}
          addMovie: null
        item-update:
          data:
            ${{ $entity }}: ${{ $row }}
          updateMovie: null
        item-delete:
          data:
            id: ${{ $row.id }}
          deleteMovie: null
      content-type: xml
  src-myplan:
    provider: plans
  fake:
    provider: fake-data
    options:
      seed: 42
      autocreate: true
      entities:
        contacts:
          locale: en_EN
          rows: 100
          fields:
            id: string.uuid()
            firstname: person.firstName()
            lastname: person.lastName()
            email: internet.email()
            ExternalRef: 'string.alphanumeric({ length: 10, casing: ''upper'' })'
            user: internet.username()
        books:
          locale: en_EN
          rows: 50
          fields:
            title: book.title()
            author: book.author()
            publishedAt: date.anytime()
schemas:
  fs:
    source: src-fs
  myplan:
    source: src-myplan
    entities:
      contacts:
        source: fake
        entity: contacts
  json:
    source: src-json
  failed:
    source: src-fs-failed
  fake:
    source: fake
plans:
  plan-failed:
    steps:
      - select:
          schema: fs
          entity: img
          fields: '*,content'
          on-error:
            strategy: throw
            scope: step
      - select:
          schema: fs
          entity: fake-skipped
          on-error:
            strategy: skip
            scope: step
      - select:
          schema: fs
          entity: fake-failed
          on-error:
            strategy: throw
            scope: step
    on-error:
      strategy: throw
      scope: step
    failure-strategy: throw
  plan-2:
    steps:
      - select:
          schema: fs
          entity: img
          fields: '*,content'
          on-error:
            strategy: throw
            scope: step
    on-error:
      strategy: throw
      scope: step
    failure-strategy: throw
  myplan:
    steps:
      - select:
          schema: fs
          entity: img
          fields: '*,content'
          on-error:
            strategy: throw
            scope: step
      - omit:
          fields:
            - content
          on-error:
            strategy: throw
            scope: step
      - insert:
          schema: json
          entity: output.json
          on-error:
            strategy: throw
            scope: step
    on-error:
      strategy: throw
      scope: step
    failure-strategy: throw
schedules:
  sch-myplan:
    plan: myplan
    cron: '@start'
  sch-failed:
    plan: plan-failed
    cron: '@start'
  sch-2:
    plan: plan-2
    cron: '@start'
mcp:
  tools:
    get_images:
      description: Get list of images
      schema: fs
      limit: 50
      entity: img
      action: read
      arguments:
        filename:
          type: string
          required: false
          description: Filter by filename (partial match)
          map-to: name
    get_image_content:
      description: Get image content
      schema: fs
      limit: 1
      entity: img
      action: read
      fields:
        - content
      arguments:
        filename:
          type: string
          required: false
          description: Filter by filename
          map-to: name
    get_recovery:
      description: Get recovery
      schema: fs
      limit: 10
      entity: rec
      action: read
      arguments:
        filename:
          type: string
          required: false
          description: Filter by filename
          map-to: name
    list_folders:
      description: Get list of folders
      schema: fs
      limit: 5
      action: list
      arguments: {}
    create_file:
      description: Create a file input
      schema: json
      limit: 10
      entity: output.json
      action: create
      arguments:
        file:
          type: structure
          required: true
          description: File details
          properties:
            name:
              type: string
              required: true
              map-to: name
            type:
              type: string
              required: true
              map-to: type
            size:
              type: number
              required: true
              map-to: size
  hide-sensitive-data:
    - password
    - secret
    - path
