version: "0.3"

server:
  port: 3000
  verbosity: debug
  timezone: UTC
  request-limit: 100mb
  authentication:
    provider: local
    default-role: all
  cache:
    provider: memory
    database: cache
    options:
      autocreate: true

roles:
  all: lacrud
  none:

users:
  myapiuser:
    password: myStr@ngpa$$w0rd

sources:
  src-mem:
    provider: memory
    database: memory
    options:
      autocreate: true

  rest-fakerestapi:    # https://fakerestapi.azurewebsites.net/index.html
    provider: webservice
    host: https://fakerestapi.azurewebsites.net/api/v1/
    options:
      type: rest
      content: json
      endpoints:
        collection:
          read: 
            get:
        item:
          read: 
            get:
              request: /${{ $item.id }}
          create: 
            post:
          update: 
            put:
              request: /${{ $item.id }}
          delete: 
            delete:
              request: /${{ $item.id }}
      
  rest-dummyjson:    # https://dummyjson.com/docs
    provider: webservice
    host: https://dummyjson.com/
    options:
      type: rest
      content: json
      endpoints:
        session: 
          post:
            request: /user/login
            data:
              username: emilys
              password: emilyspass
            session-headers:
              Authorization: "Bearer: ${{ $response.body.accessToken }}"
        collection:
          read: 
            get:
              response: ${{ $request.entity }}
        item:
          read: 
            get: 
              request: /${{ $item.id }}
          create: 
            post: 
              request: /add
          update: 
            put: 
              request: /${{ $item.id }}
          delete: 
            delete: 
              request: /${{ $item.id }}
      
  rest-dog:    # https://dog.ceo/dog-api/documentation/
    provider: webservice
    host: https://dog.ceo/api
    options:
      type: rest
      content: json
      endpoints:
        collection:
          read: 
            get:
              request: /list/all
              response: message
      
  soap-movies:    # http://localhost:8080/ws/movies.wsdl
    provider: webservice
    host: http://localhost:8080/ws/movies.wsdl
    options:
      type: soap
      content: xml
      # XXX xml-path: SOAP-ENV:Envelope.SOAP-ENV:Body.ns2:${{ $endpoint.name }}Response.ns2:${{ $request.entity }}
      endpoints:
        collection:
          read:
            listMovies:
              response: SOAP-ENV:Envelope.SOAP-ENV:Body.ns2:listMoviesResponse.ns2:movies
      
  soap-missions:    # https://www.crcind.com/csp/samples/SOAP.Demo.cls
    provider: webservice
    host: https://www.crcind.com/csp/samples/SOAP.Demo.CLS?WSDL=1
    options:
      type: soap
      content: xml
      endpoints:
        collection:
          read:
            GetListByName:
              response: SOAP-ENV:Envelope.SOAP-ENV:Body.GetListByNameResponse.GetListByNameResult.PersonIdentification

schemas:
  # ws1:
  #   source: rest-fakerestapi
  # ws2:
  #   source: rest-dummyjson
  # ws3:
  #   source: rest-dog
  # soap-movies:
  #   source: soap-movies
  soap-missions:
    source: soap-missions