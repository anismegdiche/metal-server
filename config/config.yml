version: "0.3"

server:
  port: 3000
  verbosity: debug
  timezone: UTC
  request-limit: 100mb
  authentication:
    provider: local
    default-role: all
  cache:
    provider: memory
    database: cache
    options:
      autocreate: true

roles:
  all: lacrud
  none:

users:
  myapiuser:
    password: myStr@ngpa$$w0rd

sources:
  src-mem:
    provider: memory
    database: memory
    options:
      autocreate: true

  src-ws-fakerestapi:    # https://fakerestapi.azurewebsites.net/index.html
    provider: webservice
    host: https://fakerestapi.azurewebsites.net/api/v1/
    options:
      type: rest
      content: json
      endpoints:
        collection:
          read: 
            get:
        item:
          read: 
            get: /${{ $item.id }}
          create: 
            post:
          update: 
            put: /${{ $item.id }}
          delete: 
            delete: /${{ $item.id }}
      
  src-ws-dummyjson:    # https://dummyjson.com/docs
    provider: webservice
    host: https://dummyjson.com/
    options:
      type: rest
      content: json
      json-path: ${{ $entity }}
      endpoints:
        login: 
          url: 
            post: /user/login
          data:
            username: emilys
            password: emilyspass
          headers:
            Authorization: "Bearer: ${{ $response.body.accessToken }}"
        collection:
          read: 
            get:
        item:
          read: 
            get: /${{ $item.id }}
          create: 
            post: /add
          update: 
            put: /${{ $item.id }}
          delete: 
            delete: /${{ $item.id }}
      
  src-ws-dog:    # https://dog.ceo/dog-api/documentation/
    provider: webservice
    host: https://dog.ceo/api
    options:
      type: rest
      content: json
      json-path: message
      endpoints:
        collection:
          read: 
            get: /list/all

schemas:
  ws1:
    source: src-ws-fakerestapi
  ws2:
    source: src-ws-dummyjson
  ws3:
    source: src-ws-dog