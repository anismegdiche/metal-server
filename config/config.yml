version: "0.5"

server:
  port: 3000
  verbosity: debug
  timezone: UTC
  request-limit: 100mb
  response-limit: 100mb
  authentication:
    provider: local
    default-role: all
  cache:
    provider: memory
    database: cache
    options:
      autocreate: true
  ai-engines:
    timeout: 600000

roles:
  all: lacrud

users:
  myapiuser:
    password: myStr@ngpa$$w0rd

sources:
  src-fs:
    provider: storage
    options:
      mode: folders
      storage-type: fs
      fs-folder: ./data/
  src-files:
    provider: storage
    options:
      mode: files
      storage-type: fs
      fs-folder: ./data/
      autocreate: true
      content:
        "*.json":
          content-type: json
          json-path: rows
        "*.csv":
          content-type: csv
          csv-quote: '"'

  src-myplan:
    provider: plan
    database: myplan

schemas:
  fs:
    source: src-fs
  myplan:
    source: src-myplan
  files:
    source: src-files

schedules:
  # "ocr":
  #   plan: myplan
  #   entity: myentity
  #   cron: "*/1 * * * *"
  "ocr2":
    plan: myplan
    entity: myentity
    cron: "@start"

plans:
  myplan:
    myentity:
      - select:
          schema: fs
          entity: img
          fields: "*,content"

      - run:
          ai: ocr
          task: image-to-string
          params:
            lang: en_XX
          input: content
          output:
            _ocr_text: ${{ $result.ocr.text }}
            _ocr_lang_code: (${{ $result.ocr.lang.split('_')[0].toUpperCase() }})

      - omit: [content]

      - insert:
          schema: files
          entity: output.csv
