version: "0.5"

server:
  port: 3000
  verbosity: debug
  timezone: UTC
  request-limit: 100mb
  response-limit: 100mb
  authentication:
    provider: local
    default-role: all
  cache:
    provider: memory
    database: cache
    options:
      autocreate: true
  ai-engines:
    # docker-url:
    engines-url: http://localhost:5000
  

roles:
  all: lacrud

users:
  myapiuser:
    password: myStr@ngpa$$w0rd

sources:
  src-fs:
    provider: folder
    options:
      storage: fs
      fs-folder: ./data/
  src-myplan:
    provider: plan
    database: myplan

schemas:
  fs:
    source: src-fs
  myplan:
    source: src-myplan
    

schedules:
  "p1":
    plan: myplan
    entity: myentity
    cron: "*/1 * * * *"
  "p2":
    plan: myplan
    entity: myentity
    cron: "@start"

plans:
  myplan:
    myentity:
      - select:
          schema: fs
          entity: pic

      - run:
          ai: image
          task: image-to-text
          input: content
          output:
            generated_text: description

      - run:
          ai: image
          task: object-detection
          input: content
          output:

      # - run:
      #     ai: text
      #     task: emotion-detection
      #     params:
      #       top_k: 10
      #     input: ocr_text
      #     output:

      # - run:
      #     ai: text
      #     task: translation
      #     params:
      #       src_lang: en_XX
      #       tgt_lang: ar_AR
      #     input: ocr_text
      #     output:
      #       translation_text: translated_text

      - fields: name, mimeType, type, size, createdAt, modifiedAt, path, description
    