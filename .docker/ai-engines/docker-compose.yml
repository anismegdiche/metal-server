services:

  #
  # Base Image (Build this first: docker-compose build base)
  #
  base-text:
    image: metal-ai-engine-base-text:1.0.0
    build: ./services/base/text

  base-image:
    image: metal-ai-engine-base-image:1.0.0
    build: ./services/base/image

  base-audio:
    image: metal-ai-engine-base-audio:1.0.0
    build: ./services/base/audio

  #
  # Text
  #

  text-emotion-detection:
    build: ./services/text/emotion-detection
    command: uvicorn app:app --host 0.0.0.0 --port 5000 --reload
    ports:
      - "5101:5000"
    volumes:
      - ./services/text/emotion-detection:/app
      - metal-model-cache:/data/models
    environment:
      - ALLOWED_ORIGINS=*
      - ALLOWED_METHODS=GET,POST,OPTIONS
      - ALLOWED_HEADERS=Content-Type,Authorization,X-Requested-With

