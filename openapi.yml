openapi: "3.0.3"
info:
  title: Metal Server API Docs
  version: "0.5"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    dataResponse:
      type: object
      properties:
        schema:
          type: string
          description: Name of the schema
        entity:
          type: string
          description: Name of the entity
        status:
          description: Status
          type: integer
          enum: [200]
        metadata:
          description: Metadata
          type: object
        rows:
          description: Data
          type: array
          items:
            type: object
      required:
        - schema
        - entity
        - status
        - metadata
        - rows

    filter:
      type: object
      description: Simple filtering feature by providing fields and values

    filter-expression:
      type: string
      description: SQL WHERE condition

    fields:
      type: string
      description: Fields to return

    sort:
      type: object
      description: Sorting order

    cache:
      type: number
      description: Cache time in seconds

    data:
      description: Data to insert or update
      oneOf:
        - type: array
        - type: object

  responses:
    DefaultError:
      description: Unexpected error
      content:
        application/json:
          schema:
            type: object
    http400:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object

    http401:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object

    http403:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object

    http404:
      description: Not Found
      content:
        application/json:
          schema:
            type: object

    http500:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
  parameters:
    schema:
      in: path
      name: schema
      schema:
        type: string
      required: true
      description: Name of the schema

    entity:
      in: path
      name: entity
      schema:
        type: string
      required: true
      description: Name of the entity

tags:
  - name: "User"
    description: "Operations about User"
    externalDocs:
      description: "Find out more"
      url: "https://metal-docs-sh3b0.kinsta.page/documentation/rest-api.html#user"

  - name: "Schema"
    description: "Operations about Schema"
    externalDocs:
      description: "Find out more"
      url: "https://metal-docs-sh3b0.kinsta.page/documentation/rest-api.html#schema"

  - name: "Entity"
    description: "Operations about Entity"
    externalDocs:
      description: "Find out more"
      url: "https://metal-docs-sh3b0.kinsta.page/documentation/rest-api.html#schema"

  - name: "MCP"
    description: "Operations about MCP requests"

  - name: "API"
    description: "Operations about API internals"

  - name: "Server"
    description: "Operations about Server"
    externalDocs:
      description: "Find out more"
      url: "https://metal-docs-sh3b0.kinsta.page/documentation/rest-api.html#server"

paths:
  /health:
    get:
      tags:
        - Server
      summary: Health check
      description: Returns the server health status (no authentication required)
      security: []
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  uptime:
                    type: number
                  timestamp:
                    type: string
                    format: date-time
        500:
          $ref: "#/components/responses/http500"

  /user/login:
    post:
      summary: Login to the Metal server
      description: Returns a JWT token if the credentials are valid
      tags:
        - User
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
              additionalProperties: false
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        500:
          $ref: "#/components/responses/http500"

  /user/logout:
    post:
      summary: Logout from the Metal server
      description: Invalidates the JWT token
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        204:
          description: Successful logout
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        500:
          $ref: "#/components/responses/http500"

  /user/info:
    get:
      summary: Get user information
      description: Returns user information
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Successful retrieval of user information
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

  /schema/{schema}:
    get:
      tags:
        - Schema
      summary: List entities in a schema
      description: Retrieves a list of entities in the specified schema
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: schema
          schema:
            type: string
          required: true
          description: The name of the schema
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: A list of entities in the schema
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        404:
          $ref: "#/components/responses/http404"
        500:
          $ref: "#/components/responses/http500"

  /schema/{schema}/{entity}:
    get:
      tags:
        - Entity
      summary: Get data from an entity in the schema
      description: Retrieves data from an entity in the specified schema
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/schema"
        - $ref: "#/components/parameters/entity"
        - in: query
          name: filter
          schema:
            $ref: "#/components/schemas/filter"
          required: false
          allowReserved: true
          description: Simple filtering feature by providing fields and values
        - in: query
          name: filter-expression
          schema:
            $ref: "#/components/schemas/filter-expression"
          required: false
          allowReserved: true
          description: Free expression for more complex data filtering expressed in SQL-like syntax
        - in: query
          name: fields
          schema:
            $ref: "#/components/schemas/fields"
          required: false
          allowReserved: true
          description: fields to return
        - in: query
          name: cache
          schema:
            $ref: "#/components/schemas/cache"
          required: false
          description: cache the returned data for given seconds
        - in: query
          name: sort
          schema:
            $ref: "#/components/schemas/sort"
          required: false
          allowReserved: true
          description: sort data with given order
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dataResponse"
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        404:
          $ref: "#/components/responses/http404"
        500:
          $ref: "#/components/responses/http500"

    post:
      tags:
        - Entity
      summary: Insert Data in an entity in the schema
      description: Creates a new entity in the specified schema
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/schema"
        - $ref: "#/components/parameters/entity"
      requestBody:
        description: Optional parameters
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - data
              properties:
                data:
                  $ref: "#/components/schemas/data"
      responses:
        201:
          description: Operation success
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        404:
          $ref: "#/components/responses/http404"
        500:
          $ref: "#/components/responses/http500"

    patch:
      tags:
        - Entity
      summary: Update Data in an entity in the schema
      description: updates an existing entity in the specified schema
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: schema
          schema:
            type: string
          required: true
          description: The name of the schema
        - in: path
          name: entity
          schema:
            type: string
          required: true
          description: The name of the entity
      requestBody:
        description: Optional parameters
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - data
              properties:
                filter:
                  $ref: "#/components/schemas/filter"
                filter-expression:
                  $ref: "#/components/schemas/filter-expression"
                data:
                  $ref: "#/components/schemas/data"
      responses:
        204:
          description: Operation success
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        404:
          $ref: "#/components/responses/http404"
        500:
          $ref: "#/components/responses/http500"

    delete:
      tags:
        - Entity
      summary: Delete Data in an entity in the schema
      description: Deletes an existing entity in the specified schema
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: schema
          schema:
            type: string
          required: true
          description: The name of the schema
        - in: path
          name: entity
          schema:
            type: string
          required: true
          description: The name of the entity
      requestBody:
        description: Optional parameters
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                filter:
                  $ref: "#/components/schemas/filter"
                filter-expression:
                  $ref: "#/components/schemas/filter-expression"
      responses:
        204:
          description: Operation success
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        404:
          $ref: "#/components/responses/http404"
        500:
          $ref: "#/components/responses/http500"

  /mcp:
    post:
      tags:
        - MCP
      summary: Handle MCP request
      description: Forwards a request to the MCP adapter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: MCP response
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

  /api/server/info:
    get:
      tags:
        - API
      summary: Get server information
      description: Returns server information
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Server information
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

  /api/server/reload:
    post:
      tags:
        - API
      summary: Reload server
      description: Reloads the server
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Server reloaded
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

  /api/server/reload-plans:
    post:
      tags:
        - API
      summary: Reload plans
      description: Reloads all plans without restarting the server
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Plans reloaded
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

  /api/cache/view:
    get:
      tags:
        - API
      summary: View cache
      description: Returns the current cache
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Cache data
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        404:
          $ref: "#/components/responses/http404"
        500:
          $ref: "#/components/responses/http500"

  /api/cache/clean:
    post:
      tags:
        - API
      summary: Clean cache
      description: Cleans the cache
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Cache cleaned
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

  /api/cache/purge:
    post:
      tags:
        - API
      summary: Purge cache
      description: Purges the cache
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Cache purged
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

  /api/plan/{plan}/reload:
    post:
      summary: Reload plan
      description: Reload plan by name
      tags:
        - API
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: plan
          schema:
            type: string
          required: true
          description: Plan name
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Plan reloaded successfully
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        404:
          $ref: "#/components/responses/http404"
        500:
          $ref: "#/components/responses/http500"

  /api/config:
    get:
      summary: Get full configuration
      description: Returns the entire server configuration
      tags:
        - API
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Full configuration object
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

    put:
      summary: Replace full configuration
      description: Replaces the entire server configuration after validation
      tags:
        - API
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Configuration saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

  /api/config/reload:
    post:
      summary: Reload server from config
      description: Reloads the server after a configuration change
      tags:
        - API
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Server reloaded
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

  /api/config/{section}:
    get:
      summary: Get config section
      description: Returns a specific configuration section (e.g. server, sources, schemas, plans, schedules)
      tags:
        - API
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: section
          schema:
            type: string
            enum:
              [
                server,
                sources,
                schemas,
                plans,
                schedules,
                roles,
                users,
                ai-engines,
              ]
          required: true
          description: The configuration section name
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Section data
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

    patch:
      summary: Patch config section
      description: Merges data into an existing configuration section
      tags:
        - API
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: section
          schema:
            type: string
            enum:
              [
                server,
                sources,
                schemas,
                plans,
                schedules,
                roles,
                users,
                ai-engines,
              ]
          required: true
          description: The configuration section name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Section patched
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

  /api/config/{section}/{name}:
    get:
      summary: Get config item
      description: Returns a named item within a configuration section
      tags:
        - API
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: section
          schema:
            type: string
            enum:
              [
                server,
                sources,
                schemas,
                plans,
                schedules,
                roles,
                users,
                ai-engines,
              ]
          required: true
          description: The configuration section name
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: The item name within the section
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Item data
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        404:
          $ref: "#/components/responses/http404"
        500:
          $ref: "#/components/responses/http500"

    put:
      summary: Create or update config item
      description: Creates or updates a named item within a configuration section
      tags:
        - API
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: section
          schema:
            type: string
            enum:
              [
                server,
                sources,
                schemas,
                plans,
                schedules,
                roles,
                users,
                ai-engines,
              ]
          required: true
          description: The configuration section name
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: The item name within the section
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Item saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

    delete:
      summary: Delete config item
      description: Deletes a named item from a configuration section
      tags:
        - API
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: section
          schema:
            type: string
            enum:
              [
                server,
                sources,
                schemas,
                plans,
                schedules,
                roles,
                users,
                ai-engines,
              ]
          required: true
          description: The configuration section name
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: The item name within the section
      responses:
        default:
          $ref: "#/components/responses/DefaultError"
        200:
          description: Item deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

  /api/logs:
    delete:
      tags:
        - API
      summary: Clear logs
      description: Clears all server logs
      security:
        - bearerAuth: []
      responses:
        204:
          description: Logs cleared
        400:
          $ref: "#/components/responses/http400"
        401:
          $ref: "#/components/responses/http401"
        403:
          $ref: "#/components/responses/http403"
        500:
          $ref: "#/components/responses/http500"

  /api/logs/{start}/{end}/{limit}/{offset}/{reverse}:
    get:
      tags:
        - API
      summary: Get logs
      description: Retrieves logs for the requested range and pagination parameters
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: start
          schema:
            type: string
          required: true
