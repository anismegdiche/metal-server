services:
  koboldcpp:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ../../../docker-volumes/koboldcpp/models:/models
    environment:
      MODEL_REPO: "bartowski/Llama-3-Groq-8B-Tool-Use-GGUF"
      MODEL_FILE: "Llama-3-Groq-8B-Tool-Use-Q4_K_M.gguf"
      CTX_SIZE: "4096"
      THREADS: "6"   # set to your physical core count
      PORT: "8080"
    deploy:
      resources:
        limits:
          memory: 12g   # leave headroom on a 16GB host
    restart: unless-stopped
